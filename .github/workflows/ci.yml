name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,pandas,parquet]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest --cov=grimescan --cov-report=term-missing
      - name: Smoke test CLI
        run: |
          grimescan --version
          grimescan checks > /dev/null
          grimescan demo --rows 3000 --out demo-report -q
          test -f demo-report/report.html
